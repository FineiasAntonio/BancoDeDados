services:
  postgres:
    image: postgres:16-alpine
    container_name: movielens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: movielens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./relational/postgres_ddl.sql:/docker-entrypoint-initdb.d/01_schema.sql

  cassandra:
    image: cassandra:5.0
    container_name: movielens_cassandra
    restart: unless-stopped
    environment:
      MAX_HEAP_SIZE: 2G
      HEAP_NEWSIZE: 400M
      CASSANDRA_CLUSTER_NAME: movielens
    ports:
      - "9042:9042"   # protocolo CQL (drivers e cqlsh)
    volumes:
      - cassandradata:/var/lib/cassandra

volumes:
  pgdata:
  cassandradata:
