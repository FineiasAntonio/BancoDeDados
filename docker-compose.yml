services:
  postgres:
    image: postgres:16-alpine
    container_name: movielens_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: movielens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./relational/postgres_ddl.sql:/docker-entrypoint-initdb.d/01_schema.sql

  neo4j:
    image: neo4j:5.26-community
    container_name: movielens_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # protocolo Bolt (drivers e cypher-shell)
    volumes:
      - neo4jdata:/data

volumes:
  pgdata:
  neo4jdata:
